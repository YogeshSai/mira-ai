name: Refresh fund data
on:
  schedule: [{cron: "30 2 * * *"}]   # daily, 02:30 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python3 build_data.py
      - run: |
          mv fund-check.html index.html
          rm -f funds.db funds.db.zst funds_data.json.gz
          git config user.name "fund-check-bot"; git config user.email "bot@users.noreply.github.com"
          git add index.html && (git commit -m "Refresh NAV data" && git push || echo "no change")
